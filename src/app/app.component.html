<nav class="nav-bar">
  <a class="nav-brand" routerLink="/" (click)="playNavSound()">
    <img class="nav-icon" src="assets/images/tree-icon.svg" alt="Dojo" />
    MOKUAPP
  </a>
  <div class="nav-links">
    @for (item of navItems; track item.path) {
      <a
        class="nav-link"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        (click)="playNavSound()"
      >
        {{ item.icon }} {{ item.label }}
      </a>
    }
  </div>
</nav>
<main class="main-content">
  <router-outlet />
</main>
