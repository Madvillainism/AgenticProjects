@if (outfit(); as o) {
  <div class="result-page">
    <header class="result-header">
      <button mat-icon-button class="back-btn" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <div class="header-badge">
        <mat-icon class="sparkle">auto_awesome</mat-icon>
        IA
      </div>
    </header>

    <div class="hero">
      <h1 class="hero-prompt">{{ o.prompt }}</h1>
      <span class="hero-gender">{{ genderLabel(o.gender) }}</span>
    </div>

    @if (o.descriptionText) {
      <div class="description-card">
        <p class="description-text">{{ o.descriptionText }}</p>
      </div>
    }

    <div class="actions-row">
      <button mat-stroked-button class="action-btn" (click)="toggleFavorite(o.id!)">
        <mat-icon>{{ o.isFavorite ? 'favorite' : 'favorite_border' }}</mat-icon>
        {{ o.isFavorite ? 'Guardado' : 'Guardar' }}
      </button>

      <a mat-stroked-button class="action-btn pinterest-btn"
         [href]="pinterestUrl()"
         target="_blank"
         rel="noopener noreferrer">
        <mat-icon>search</mat-icon>
        Buscar en Pinterest
      </a>

      <button mat-stroked-button class="action-btn" (click)="goBack()">
        <mat-icon>refresh</mat-icon>
        Nuevo
      </button>
    </div>
  </div>
}
